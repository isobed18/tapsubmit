<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign in · ApplyBurst</title><link rel="stylesheet" href="/applyburst/assets/style.css"><script type="module" src="/applyburst/assets/auth.js"></script></head><body data-screen="login"><main class="login-wrap"><a class="brand" href="/applyburst/">applyburst<span class="dot"></span></a><section class="login-card"><h1 id="auth-title">Your local workspace.</h1><p id="auth-note" class="muted">Checking your account…</p><form id="login-form"><label>Username<input name="username" autocomplete="username" minlength="3" maxlength="80" required autofocus></label><label>Password<input id="password" name="password" type="password" autocomplete="current-password" required></label><label id="confirm-label" hidden>Confirm password<input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password"></label><p id="login-error" class="error" role="alert"></p><button id="auth-submit" class="primary" type="submit" disabled>Sign in</button></form><p class="fine">One owner account on this computer. CV and website sign-ins stay local.</p></section></main></body></html>
