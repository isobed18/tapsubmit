name: CPU baseline

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked --extra bench
      - name: Install browser for existing local form checks
        run: uv run --extra bench python -m playwright install --with-deps chromium
      - run: uv run --extra bench python -m pytest -q
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Verify detailed CPU search, feed normalization and form inspection
        run: node --test demo/tests/*.test.mjs web/tests/*.test.mjs
      - name: Verify loopback HTTP and SMTP execution without a GPU
        run: uv run --extra bench python -m applyburst.bench --jobs 10 --repeats 1 --output artifacts/ci-smoke.json
