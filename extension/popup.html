<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TapSubmit</title>
  <style>
    body {
      margin: 0;
      padding: 14px;
      width: 280px;
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #111318;
      background: #fafafa;
    }
    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .brand {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.02em;
    }
    .pill {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #e5e7eb;
      color: #374151;
    }
    .pill.ok {
      background: #d1fae5;
      color: #065f46;
    }
    .meta {
      font-size: 12px;
      color: #4b5563;
      margin-bottom: 12px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    button, a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      border-radius: 8px;
      font: 600 12.5px/1.2 inherit;
      cursor: pointer;
      text-decoration: none;
      border: 1px solid #d1d5db;
      background: #fff;
      color: #111318;
    }
    button.primary {
      background: #111318;
      color: #fff;
      border-color: #111318;
    }
  </style>
</head>
<body>
  <div class="head">
    <span class="brand">TapSubmit</span>
    <span class="pill" id="sync-pill">Checking…</span>
  </div>
  <div class="meta" id="profile-meta">Connect your account on tapsubmit.com to sync your CV and answer memory.</div>
  <div class="actions">
    <button type="button" class="primary" id="fill-tab">Fill this application page</button>
    <a class="btn" id="open-site" href="https://tapsubmit.com" target="_blank" rel="noopener">Open TapSubmit</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
